name: application-catalog

on:
  pull_request:
  push:
    branches:
      - feat/application-catalog-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out catalog sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned yq
        run: go install github.com/mikefarah/yq/v4@v4.47.2

      - name: Validate application packages and deterministic release
        run: make check
