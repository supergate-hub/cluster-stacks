apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: launcher-slurm-clusters
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: git@github.com:supergate-hub/cluster-stacks.git
        revision: HEAD
        directories:
          - path: clusters/slurm/*
  template:
    metadata:
      name: "slurm-{{.path.basename}}"
      namespace: argocd
      labels:
        app.kubernetes.io/managed-by: launcher
        launcher.supergate.io/cluster-type: slurm
    spec:
      project: default
      source:
        repoURL: git@github.com:supergate-hub/cluster-stacks.git
        targetRevision: HEAD
        path: "{{.path.path}}"
      destination:
        # Target the tenant cluster registered in ArgoCD with name matching path.basename.
        # The RegisterCluster call in SlurmProvider.Get() creates the cluster Secret
        # with metadata.name == cluster name (e.g. "e2e-v1").
        name: "{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
