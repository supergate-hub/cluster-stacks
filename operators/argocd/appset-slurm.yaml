apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: launcher-slurm-clusters
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/supergate-hub/cluster-stacks.git
        revision: HEAD
        directories:
          - path: clusters/slurm/*
  template:
    metadata:
      name: "slurm-{{.path.basename}}"
      namespace: argocd
      labels:
        app.kubernetes.io/managed-by: launcher
        launcher.supergate.io/cluster-type: slurm
    spec:
      project: default
      source:
        repoURL: https://github.com/supergate-hub/cluster-stacks.git
        targetRevision: HEAD
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
