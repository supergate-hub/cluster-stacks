apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-admin-rbac
  namespace: NAMESPACE
data:
  tenant-admin-rbac.yaml: |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: kubeadm-cluster-admins
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: cluster-admin
    subjects:
      - apiGroup: rbac.authorization.k8s.io
        kind: Group
        name: kubeadm:cluster-admins
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: tenant-admin-rbac
  namespace: NAMESPACE
spec:
  strategy: Reconcile
  clusterSelector:
    matchLabels:
      cni: cilium
  resources:
    - name: tenant-admin-rbac
      kind: ConfigMap
