schemaVersion: 1
engine: sveltos
sveltos:
  apiVersion: config.projectsveltos.io/v1beta1
  syncMode: Continuous
  driftDetection: false
  healthChecks: false
helm:
  valueMappings:
    headlamp.clusterRoleBinding.clusterRoleName: configuration.clusterRoleName
lifecycle:
  defaultDataPolicy: Delete
  supportedDataPolicies:
    - Delete
  retainedResources: []
access:
  type: service-proxy
  serviceNameTemplate: "${releaseName}-headlamp"
  servicePort: 80
