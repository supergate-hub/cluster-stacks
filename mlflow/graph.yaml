schemaVersion: 1
engine: sveltos
sveltos:
  apiVersion: config.projectsveltos.io/v1beta1
  syncMode: Continuous
  driftDetection: false
  healthChecks: false
helm:
  fixedValues:
    auth.enabled: true
    postgresql.enabled: true
    minio.enabled: true
  valueMappings:
    auth.adminUsername: authentication.adminUsername
    postgresql.primary.persistence.storageClass: storage.storageClassName
    postgresql.primary.persistence.size: storage.databaseStorageSize
    minio.persistence.storageClass: storage.storageClassName
    minio.persistence.size: storage.artifactStorageSize
lifecycle:
  defaultDataPolicy: Retain
  supportedDataPolicies:
    - Retain
    - Delete
  retainedResources:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      nameTemplate: "${releaseName}-minio"
    - apiVersion: v1
      kind: PersistentVolumeClaim
      nameTemplate: "data-${releaseName}-postgresql-0"
access:
  type: service-proxy
  serviceNameTemplate: "${releaseName}"
  servicePort: 80
  credential:
    source: target-secret
    secretNameTemplate: "${releaseName}-auth-admin-secret"
    usernameKey: username
    secretKey: password
