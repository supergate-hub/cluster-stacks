apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: launcher-tenant-addons
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # 1. Discover tenant clusters registered in ArgoCD (by label)
          - clusters:
              selector:
                matchLabels:
                  launcher.supergate.io/cluster-type: slurm
          # 2. List of addons to deploy (order matters via sync-wave)
          - list:
              elements:
                - addon: local-path-provisioner
                  namespace: local-path-storage
                  wave: "0"
                - addon: compute-csi-plugin
                  namespace: kube-system
                  wave: "1"
                - addon: openstack-cloud-controller-manager
                  namespace: kube-system
                  wave: "2"
                - addon: cert-manager
                  namespace: cert-manager
                  wave: "3"
                - addon: slinky-crds
                  namespace: slinky-system
                  wave: "4"
                - addon: slinky-operator
                  namespace: slinky-system
                  wave: "5"
  template:
    metadata:
      name: "{{.name}}-{{.addon}}"
      namespace: argocd
      labels:
        app.kubernetes.io/managed-by: launcher
        launcher.supergate.io/component: tenant-addon
      annotations:
        argocd.argoproj.io/sync-wave: "{{.wave}}"
    spec:
      project: default
      source:
        repoURL: git@github.com:supergate-hub/cluster-stacks.git
        targetRevision: HEAD
        path: "catalog/{{.addon}}"
        helm:
          valueFiles:
            - values.yaml
          values: |
            {{- $hostAliasIP := index .metadata.labels "launcher.supergate.io/openstack-host-alias-ip" }}
            {{- $hostAliasDNS := index .metadata.labels "launcher.supergate.io/openstack-host-alias-dns" }}
            {{- if and (eq .addon "compute-csi-plugin") $hostAliasIP $hostAliasDNS }}
            openstack-cinder-csi:
              csi:
                plugin:
                  nodePlugin:
                    hostAliases:
                      - ip: "{{ $hostAliasIP }}"
                        hostnames:
                          - "{{ $hostAliasDNS }}"
                  controllerPlugin:
                    hostAliases:
                      - ip: "{{ $hostAliasIP }}"
                        hostnames:
                          - "{{ $hostAliasDNS }}"
            {{- end }}
            {{- if and (eq .addon "openstack-cloud-controller-manager") $hostAliasIP $hostAliasDNS }}
            openstack-cloud-controller-manager:
              hostAliases:
                - ip: "{{ $hostAliasIP }}"
                  hostnames:
                    - "{{ $hostAliasDNS }}"
            {{- end }}
          parameters:
            - name: openstack-cinder-csi.clusterID
              value: "{{.name}}"
            - name: openstack-cloud-controller-manager.cluster.name
              value: "{{.name}}"
      destination:
        # Use cluster name (matches slurm ApplicationSet) so ArgoCD treats them as the same cluster.
        name: "{{.name}}"
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
