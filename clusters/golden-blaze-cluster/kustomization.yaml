apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/tenant-infra
  # extra-workers.yaml holds the MachineDeployment + OpenStackMachineTemplate
  # pairs for worker groups beyond the primary. Each CAPI pool provisions
  # its own fleet of VMs with its own OpenStack flavor.
  - ./extra-workers.yaml

patches:
  - target:
      kind: Namespace
      name: NAMESPACE
    patch: |
      - op: replace
        path: /metadata/name
        value: golden-blaze-cluster
      - op: replace
        path: /metadata/labels/launcher.supergate.io~1cluster-name
        value: golden-blaze-cluster

  - target:
      kind: KamajiControlPlane
      name: CLUSTER_NAME-control-plane
    patch: |
      - op: replace
        path: /metadata/name
        value: golden-blaze-cluster-control-plane
      - op: replace
        path: /metadata/namespace
        value: golden-blaze-cluster
      - op: replace
        path: /spec/version
        value: "v1.30.0"
      - op: replace
        path: /spec/network/certSANs/0
        value: golden-blaze-cluster.k8s.launcher.internal

  - target:
      kind: Cluster
      name: CLUSTER_NAME
    patch: |
      - op: replace
        path: /metadata/name
        value: golden-blaze-cluster
      - op: replace
        path: /metadata/namespace
        value: golden-blaze-cluster
      - op: replace
        path: /spec/controlPlaneRef/name
        value: golden-blaze-cluster-control-plane
      - op: replace
        path: /spec/infrastructureRef/name
        value: golden-blaze-cluster

  - target:
      kind: OpenStackCluster
      name: CLUSTER_NAME
    patch: |
      - op: replace
        path: /metadata/name
        value: golden-blaze-cluster
      - op: replace
        path: /metadata/namespace
        value: golden-blaze-cluster
      - op: replace
        path: /spec/identityRef/name
        value: cloud-config
      - op: replace
        path: /spec/identityRef/cloudName
        value: capi-test
      - op: replace
        path: /spec/externalNetwork/id
        value: fea71d83-27da-4636-9a8b-842f93bcaccf

  - target:
      kind: OpenStackMachineTemplate
      name: CLUSTER_NAME-worker-mt
    patch: |
      - op: replace
        path: /metadata/name
        value: golden-blaze-cluster-worker-mt
      - op: replace
        path: /metadata/namespace
        value: golden-blaze-cluster
      - op: replace
        path: /spec/template/spec/flavor
        value: a4v2
      - op: replace
        path: /spec/template/spec/image/filter/name
        value: ubuntu-2404-kube-v1.30.0
      - op: replace
        path: /spec/template/spec/sshKeyName
        value: capi-test
      - op: replace
        path: /spec/template/spec/identityRef/name
        value: cloud-config
      - op: replace
        path: /spec/template/spec/identityRef/cloudName
        value: capi-test

  - target:
      kind: KubeadmConfigTemplate
      name: CLUSTER_NAME-worker-config
    patch: |
      - op: replace
        path: /metadata/name
        value: golden-blaze-cluster-worker-config
      - op: replace
        path: /metadata/namespace
        value: golden-blaze-cluster

  - target:
      kind: MachineDeployment
      name: CLUSTER_NAME-md-0
    patch: |
      - op: replace
        path: /metadata/name
        value: golden-blaze-cluster-md-0
      - op: replace
        path: /metadata/namespace
        value: golden-blaze-cluster
      - op: replace
        path: /spec/clusterName
        value: golden-blaze-cluster
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/clusterName
        value: golden-blaze-cluster
      - op: replace
        path: /spec/template/spec/version
        value: v1.30.0
      - op: replace
        path: /spec/template/spec/bootstrap/configRef/name
        value: golden-blaze-cluster-worker-config
      - op: replace
        path: /spec/template/spec/infrastructureRef/name
        value: golden-blaze-cluster-worker-mt

  - target:
      kind: ClusterResourceSet
      name: cilium-cni
    patch: |
      - op: replace
        path: /metadata/namespace
        value: golden-blaze-cluster
