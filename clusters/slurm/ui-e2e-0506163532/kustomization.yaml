apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/slurm-cluster
  # login.yaml is rendered alongside kustomization.yaml — it adds the
  # LoginSet CR and its sssd-conf Secret that the upstream base chart
  # doesn't ship. Without it the cluster has no SSH entry point.
  - ./login.yaml

patches:
  - target:
      kind: Namespace
    patch: |
      - op: replace
        path: /metadata/name
        value: slurm-ui-e2e-0506163532
      - op: replace
        path: /metadata/labels/launcher.supergate.io~1cluster-name
        value: ui-e2e-0506163532

  - target:
      kind: Controller
    patch: |
      - op: replace
        path: /metadata/name
        value: ui-e2e-0506163532
      - op: replace
        path: /metadata/namespace
        value: slurm-ui-e2e-0506163532
      - op: replace
        path: /spec/clusterName
        value: ui-e2e-0506163532

  - target:
      kind: NodeSet
    patch: |
      - op: replace
        path: /metadata/name
        value: ui-e2e-0506163532-workers
      - op: replace
        path: /metadata/namespace
        value: slurm-ui-e2e-0506163532
      - op: replace
        path: /spec/controllerRef/name
        value: ui-e2e-0506163532
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-ui-e2e-0506163532
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/slurmd/resources/limits/cpu
        value: "3"
      - op: replace
        path: /spec/slurmd/resources/limits/memory
        value: 7Gi

  - target:
      kind: RestApi
    patch: |
      - op: replace
        path: /metadata/name
        value: ui-e2e-0506163532
      - op: replace
        path: /metadata/namespace
        value: slurm-ui-e2e-0506163532
      - op: replace
        path: /spec/controllerRef/name
        value: ui-e2e-0506163532
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-ui-e2e-0506163532

  - target:
      kind: Secret
      name: slurm-auth-slurm
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-ui-e2e-0506163532
      - op: replace
        path: /data/slurm.key
        value: YDuZzFZh9zZ2x4reePbzO3zKh6+DsTW4+UG9chnNNvZGgXaMBkdwoLBAGcTK7z6pNIi60Nqp9KettRNM2ax3GQ==

  - target:
      kind: Secret
      name: slurm-auth-jwt
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-ui-e2e-0506163532
      - op: replace
        path: /data/jwt.key
        value: fO3Q4R+eVqGyvuo6HJSi3wjuSPHg9nVy4n0gmb+mmHw=
