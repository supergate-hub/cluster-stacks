apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/slurm-cluster

patches:
  - target:
      kind: Namespace
    patch: |
      - op: replace
        path: /metadata/name
        value: e2e-cm
      - op: replace
        path: /metadata/labels/launcher.supergate.io~1cluster-name
        value: e2e-cm

  - target:
      kind: Controller
    patch: |
      - op: replace
        path: /metadata/name
        value: e2e-cm
      - op: replace
        path: /metadata/namespace
        value: e2e-cm
      - op: replace
        path: /spec/clusterName
        value: e2e-cm

  - target:
      kind: NodeSet
    patch: |
      - op: replace
        path: /metadata/name
        value: e2e-cm-workers
      - op: replace
        path: /metadata/namespace
        value: e2e-cm
      - op: replace
        path: /spec/controllerRef/name
        value: e2e-cm
      - op: replace
        path: /spec/controllerRef/namespace
        value: e2e-cm
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/slurmd/resources/limits/cpu
        value: "4"
      - op: replace
        path: /spec/slurmd/resources/limits/memory
        value: 8Gi

  - target:
      kind: RestApi
    patch: |
      - op: replace
        path: /metadata/name
        value: e2e-cm
      - op: replace
        path: /metadata/namespace
        value: e2e-cm
      - op: replace
        path: /spec/controllerRef/name
        value: e2e-cm
      - op: replace
        path: /spec/controllerRef/namespace
        value: e2e-cm

  - target:
      kind: Secret
      name: slurm-auth-slurm
    patch: |
      - op: replace
        path: /metadata/namespace
        value: e2e-cm
      - op: replace
        path: /data/slurm.key
        value: xuVEBqtS+AZrXYui1gOl2/8pxm1UUyPrkHeZqcfEv/O0cFQfxQcpvcBQ+cJy2j9kLEXWjlenj6HFLwP10UC9Hw==

  - target:
      kind: Secret
      name: slurm-auth-jwt
    patch: |
      - op: replace
        path: /metadata/namespace
        value: e2e-cm
      - op: replace
        path: /data/jwt.key
        value: sEnjSKjMhhTjh+9446BI8SnYmt9jMiCzhOI1PfmzCfs=
