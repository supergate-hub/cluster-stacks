apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/slurm-cluster
  # login.yaml is rendered alongside kustomization.yaml — it adds the
  # LoginSet CR and its sssd-conf Secret that the upstream base chart
  # doesn't ship. Without it the cluster has no SSH entry point.
  - ./login.yaml

patches:
  - target:
      kind: Namespace
    patch: |
      - op: replace
        path: /metadata/name
        value: slurm-lb-test
      - op: replace
        path: /metadata/labels/launcher.supergate.io~1cluster-name
        value: lb-test

  - target:
      kind: Controller
    patch: |
      - op: replace
        path: /metadata/name
        value: lb-test
      - op: replace
        path: /metadata/namespace
        value: slurm-lb-test
      - op: replace
        path: /spec/clusterName
        value: lb-test

  - target:
      kind: NodeSet
    patch: |
      - op: replace
        path: /metadata/name
        value: lb-test-workers
      - op: replace
        path: /metadata/namespace
        value: slurm-lb-test
      - op: replace
        path: /spec/controllerRef/name
        value: lb-test
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-lb-test
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/slurmd/resources/limits/cpu
        value: "3"
      - op: replace
        path: /spec/slurmd/resources/limits/memory
        value: 7Gi

  - target:
      kind: RestApi
    patch: |
      - op: replace
        path: /metadata/name
        value: lb-test
      - op: replace
        path: /metadata/namespace
        value: slurm-lb-test
      - op: replace
        path: /spec/controllerRef/name
        value: lb-test
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-lb-test

  - target:
      kind: Secret
      name: slurm-auth-slurm
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-lb-test
      - op: replace
        path: /data/slurm.key
        value: q+ZWhL34XbVjsguTBnisaenfp9XNLuCNJ1iMxU9kPhxmWbE26hMRr1sZU3n/6WOdTi0c2dbPq3xIvX+in5RXMg==

  - target:
      kind: Secret
      name: slurm-auth-jwt
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-lb-test
      - op: replace
        path: /data/jwt.key
        value: kaYPEKB4QE/FYGsBEMOt4FBljI+99dsYjpVAXzRTDCQ=
