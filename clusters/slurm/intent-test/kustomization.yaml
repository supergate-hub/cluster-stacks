apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/slurm-cluster
  # login.yaml is rendered alongside kustomization.yaml — it adds the
  # LoginSet CR and its sssd-conf Secret that the upstream base chart
  # doesn't ship. Without it the cluster has no SSH entry point.
  - ./login.yaml

patches:
  - target:
      kind: Namespace
    patch: |
      - op: replace
        path: /metadata/name
        value: slurm-intent-test
      - op: replace
        path: /metadata/labels/launcher.supergate.io~1cluster-name
        value: intent-test

  - target:
      kind: Controller
    patch: |
      - op: replace
        path: /metadata/name
        value: intent-test
      - op: replace
        path: /metadata/namespace
        value: slurm-intent-test
      - op: replace
        path: /spec/clusterName
        value: intent-test

  - target:
      kind: NodeSet
    patch: |
      - op: replace
        path: /metadata/name
        value: intent-test-workers
      - op: replace
        path: /metadata/namespace
        value: slurm-intent-test
      - op: replace
        path: /spec/controllerRef/name
        value: intent-test
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-intent-test
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/slurmd/resources/limits/cpu
        value: "3"
      - op: replace
        path: /spec/slurmd/resources/limits/memory
        value: 7Gi

  - target:
      kind: RestApi
    patch: |
      - op: replace
        path: /metadata/name
        value: intent-test
      - op: replace
        path: /metadata/namespace
        value: slurm-intent-test
      - op: replace
        path: /spec/controllerRef/name
        value: intent-test
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-intent-test

  - target:
      kind: Secret
      name: slurm-auth-slurm
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-intent-test
      - op: replace
        path: /data/slurm.key
        value: kiemTNPOKEIa9/wzNEfHThDbUlqImwoGqL9BR9iMAhZdvd0ebRzFBNX5PGgKmFPz3nXENByHUjYmCEPLxlX8ug==

  - target:
      kind: Secret
      name: slurm-auth-jwt
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-intent-test
      - op: replace
        path: /data/jwt.key
        value: e1h4qnGPDa9+PbYhNQLrMkgPvh4KiO55F4umX7szeV0=
