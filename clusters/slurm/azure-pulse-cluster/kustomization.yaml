apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/slurm-cluster
  # login.yaml is rendered alongside kustomization.yaml — it adds the
  # LoginSet CR and its sssd-conf Secret that the upstream base chart
  # doesn't ship. Without it the cluster has no SSH entry point.
  - ./login.yaml

patches:
  - target:
      kind: Namespace
    patch: |
      - op: replace
        path: /metadata/name
        value: slurm-azure-pulse-cluster
      - op: replace
        path: /metadata/labels/launcher.supergate.io~1cluster-name
        value: azure-pulse-cluster

  - target:
      kind: Controller
    patch: |
      - op: replace
        path: /metadata/name
        value: azure-pulse-cluster
      - op: replace
        path: /metadata/namespace
        value: slurm-azure-pulse-cluster
      - op: replace
        path: /spec/clusterName
        value: azure-pulse-cluster

  - target:
      kind: NodeSet
    patch: |
      - op: replace
        path: /metadata/name
        value: azure-pulse-cluster-workers
      - op: replace
        path: /metadata/namespace
        value: slurm-azure-pulse-cluster
      - op: replace
        path: /spec/controllerRef/name
        value: azure-pulse-cluster
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-azure-pulse-cluster
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/slurmd/resources/limits/cpu
        value: "3"
      - op: replace
        path: /spec/slurmd/resources/limits/memory
        value: 7Gi

  - target:
      kind: RestApi
    patch: |
      - op: replace
        path: /metadata/name
        value: azure-pulse-cluster
      - op: replace
        path: /metadata/namespace
        value: slurm-azure-pulse-cluster
      - op: replace
        path: /spec/controllerRef/name
        value: azure-pulse-cluster
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-azure-pulse-cluster

  - target:
      kind: Secret
      name: slurm-auth-slurm
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-azure-pulse-cluster
      - op: replace
        path: /data/slurm.key
        value: dRZETeLixXQ6rGz1/GmyuHswpZ7R7QsGTBm/2nKixl+Ew9Jhc0jNHPfdXEPwHYl8dwcIrFuDgQG2W0ddQSjRpA==

  - target:
      kind: Secret
      name: slurm-auth-jwt
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-azure-pulse-cluster
      - op: replace
        path: /data/jwt.key
        value: gogbM5aNCW8Y7hoIeY1BMmCjtW+ZOqJhVnKxazZ4Gvg=
