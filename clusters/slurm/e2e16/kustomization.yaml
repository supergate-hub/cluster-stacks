apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/slurm-cluster

patches:
  - target:
      kind: Namespace
    patch: |
      - op: replace
        path: /metadata/name
        value: e2e16
      - op: replace
        path: /metadata/labels/launcher.supergate.io~1cluster-name
        value: e2e16

  - target:
      kind: Controller
    patch: |
      - op: replace
        path: /metadata/name
        value: e2e16
      - op: replace
        path: /metadata/namespace
        value: e2e16
      - op: replace
        path: /spec/clusterName
        value: e2e16

  - target:
      kind: NodeSet
    patch: |
      - op: replace
        path: /metadata/name
        value: e2e16-workers
      - op: replace
        path: /metadata/namespace
        value: e2e16
      - op: replace
        path: /spec/controllerRef/name
        value: e2e16
      - op: replace
        path: /spec/controllerRef/namespace
        value: e2e16
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/slurmd/resources/limits/cpu
        value: "4"
      - op: replace
        path: /spec/slurmd/resources/limits/memory
        value: 8Gi

  - target:
      kind: RestApi
    patch: |
      - op: replace
        path: /metadata/name
        value: e2e16
      - op: replace
        path: /metadata/namespace
        value: e2e16
      - op: replace
        path: /spec/controllerRef/name
        value: e2e16
      - op: replace
        path: /spec/controllerRef/namespace
        value: e2e16

  - target:
      kind: Secret
      name: slurm-auth-slurm
    patch: |
      - op: replace
        path: /metadata/namespace
        value: e2e16
      - op: replace
        path: /data/slurm.key
        value: KAPQ1Ax4IMfbw6KRWcVX6NYVCMtZQutkbHJrurN1g6zYS9qwhiZJmWLt2Q+/YIVSjxEZ3F6Sy0wHA0a+WlXnJQ==

  - target:
      kind: Secret
      name: slurm-auth-jwt
    patch: |
      - op: replace
        path: /metadata/namespace
        value: e2e16
      - op: replace
        path: /data/jwt.key
        value: zgB1l8K3dVn6tNIb7VzKyeKhfW1qVEVt6fUPIlxWfGg=
