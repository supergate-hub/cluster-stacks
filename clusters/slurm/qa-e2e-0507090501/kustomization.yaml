apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/slurm-cluster
  # login.yaml is rendered alongside kustomization.yaml — it adds the
  # LoginSet CR and its sssd-conf Secret that the upstream base chart
  # doesn't ship. Without it the cluster has no SSH entry point.
  - ./login.yaml

patches:
  - target:
      kind: Namespace
    patch: |
      - op: replace
        path: /metadata/name
        value: slurm-qa-e2e-0507090501
      - op: replace
        path: /metadata/labels/launcher.supergate.io~1cluster-name
        value: qa-e2e-0507090501

  - target:
      kind: Controller
    patch: |
      - op: replace
        path: /metadata/name
        value: qa-e2e-0507090501
      - op: replace
        path: /metadata/namespace
        value: slurm-qa-e2e-0507090501
      - op: replace
        path: /spec/clusterName
        value: qa-e2e-0507090501

  - target:
      kind: NodeSet
    patch: |
      - op: replace
        path: /metadata/name
        value: qa-e2e-0507090501-workers
      - op: replace
        path: /metadata/namespace
        value: slurm-qa-e2e-0507090501
      - op: replace
        path: /spec/controllerRef/name
        value: qa-e2e-0507090501
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-qa-e2e-0507090501
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/slurmd/resources/limits/cpu
        value: "3"
      - op: replace
        path: /spec/slurmd/resources/limits/memory
        value: 7Gi

  - target:
      kind: RestApi
    patch: |
      - op: replace
        path: /metadata/name
        value: qa-e2e-0507090501
      - op: replace
        path: /metadata/namespace
        value: slurm-qa-e2e-0507090501
      - op: replace
        path: /spec/controllerRef/name
        value: qa-e2e-0507090501
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-qa-e2e-0507090501

  - target:
      kind: Secret
      name: slurm-auth-slurm
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-qa-e2e-0507090501
      - op: replace
        path: /data/slurm.key
        value: 7VI9/L7FRIpKhKbrs/KdiooBsQH02hloZYMHl1OAC/XEg9yVKS9vnMQ1k5aWa7r9wTc1OMGU0ggmiZ2assU5Ew==

  - target:
      kind: Secret
      name: slurm-auth-jwt
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-qa-e2e-0507090501
      - op: replace
        path: /data/jwt.key
        value: YN7LwiD2Oz8zffwOtOpIMtjQUNeRSFRdBO1daT+9H0E=
