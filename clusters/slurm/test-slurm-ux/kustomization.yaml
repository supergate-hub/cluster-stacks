apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/slurm-cluster
  # login.yaml is rendered alongside kustomization.yaml — it adds the
  # LoginSet CR and its sssd-conf Secret that the upstream base chart
  # doesn't ship. Without it the cluster has no SSH entry point.
  - ./login.yaml

patches:
  - target:
      kind: Namespace
    patch: |
      - op: replace
        path: /metadata/name
        value: slurm-test-slurm-ux
      - op: replace
        path: /metadata/labels/launcher.supergate.io~1cluster-name
        value: test-slurm-ux

  - target:
      kind: Controller
    patch: |
      - op: replace
        path: /metadata/name
        value: test-slurm-ux
      - op: replace
        path: /metadata/namespace
        value: slurm-test-slurm-ux
      - op: replace
        path: /spec/clusterName
        value: test-slurm-ux

  - target:
      kind: NodeSet
    patch: |
      - op: replace
        path: /metadata/name
        value: test-slurm-ux-workers
      - op: replace
        path: /metadata/namespace
        value: slurm-test-slurm-ux
      - op: replace
        path: /spec/controllerRef/name
        value: test-slurm-ux
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-test-slurm-ux
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/slurmd/resources/limits/cpu
        value: "3"
      - op: replace
        path: /spec/slurmd/resources/limits/memory
        value: 7Gi

  - target:
      kind: RestApi
    patch: |
      - op: replace
        path: /metadata/name
        value: test-slurm-ux
      - op: replace
        path: /metadata/namespace
        value: slurm-test-slurm-ux
      - op: replace
        path: /spec/controllerRef/name
        value: test-slurm-ux
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-test-slurm-ux

  - target:
      kind: Secret
      name: slurm-auth-slurm
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-test-slurm-ux
      - op: replace
        path: /data/slurm.key
        value: 8nwN0VRXka5PrrHtFlRt5rkFNt1OwIxotnqs9kmcKr0MC1iu1iTXl84oR/YbG+PVDjv6lg5uMMoMIrDNk29/ZQ==

  - target:
      kind: Secret
      name: slurm-auth-jwt
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-test-slurm-ux
      - op: replace
        path: /data/jwt.key
        value: 2aRdupnmD/egBKxzlGKBof/mrnkOBuI5uPo5vJtWoUM=
