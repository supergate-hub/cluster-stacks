apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/slurm-cluster
  # login.yaml is rendered alongside kustomization.yaml — it adds the
  # LoginSet CR and its sssd-conf Secret that the upstream base chart
  # doesn't ship. Without it the cluster has no SSH entry point.
  - ./login.yaml

patches:
  - target:
      kind: Namespace
    patch: |
      - op: replace
        path: /metadata/name
        value: slurm-thh-smoke-05131429
      - op: replace
        path: /metadata/labels/launcher.supergate.io~1cluster-name
        value: thh-smoke-05131429

  - target:
      kind: Controller
    patch: |
      - op: replace
        path: /metadata/name
        value: thh-smoke-05131429
      - op: replace
        path: /metadata/namespace
        value: slurm-thh-smoke-05131429
      - op: replace
        path: /spec/clusterName
        value: thh-smoke-05131429

  - target:
      kind: NodeSet
    patch: |
      - op: replace
        path: /metadata/name
        value: thh-smoke-05131429-workers
      - op: replace
        path: /metadata/namespace
        value: slurm-thh-smoke-05131429
      - op: replace
        path: /spec/controllerRef/name
        value: thh-smoke-05131429
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-thh-smoke-05131429
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/slurmd/resources/limits/cpu
        value: "3"
      - op: replace
        path: /spec/slurmd/resources/limits/memory
        value: 7Gi
      # Primary-group Slurm partition. Uses op=add (not replace) because
      # the base NodeSet in the upstream chart doesn't declare spec.partition.
      - op: add
        path: /spec/partition
        value:
          enabled: true
          config: "Name=main Default=YES"

  - target:
      kind: RestApi
    patch: |
      - op: replace
        path: /metadata/name
        value: thh-smoke-05131429
      - op: replace
        path: /metadata/namespace
        value: slurm-thh-smoke-05131429
      - op: replace
        path: /spec/controllerRef/name
        value: thh-smoke-05131429
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-thh-smoke-05131429

  - target:
      kind: Secret
      name: slurm-auth-slurm
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-thh-smoke-05131429
      - op: replace
        path: /data/slurm.key
        value: mFq+PIaaWOEsN/ETKEJEYFh2/l15F+ci3Q/nRri8bY829IksVm10z/1LpQCa2edhdUtr6TuE/BbSbI8QNdpxzw==

  - target:
      kind: Secret
      name: slurm-auth-jwt
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-thh-smoke-05131429
      - op: replace
        path: /data/jwt.key
        value: oqEXsplvIJC3ykxIqsnqg6yLwmSxKB7ltXIOk9gsdeg=
