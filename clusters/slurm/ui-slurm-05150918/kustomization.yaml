apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/slurm-cluster
  # login.yaml is rendered alongside kustomization.yaml — it adds the
  # LoginSet CR and its sssd-conf Secret that the upstream base chart
  # doesn't ship. Without it the cluster has no SSH entry point.
  - ./login.yaml

patches:
  - target:
      kind: Namespace
    patch: |
      - op: replace
        path: /metadata/name
        value: slurm-ui-slurm-05150918
      - op: replace
        path: /metadata/labels/launcher.supergate.io~1cluster-name
        value: ui-slurm-05150918

  - target:
      kind: Controller
    patch: |
      - op: replace
        path: /metadata/name
        value: ui-slurm-05150918
      - op: replace
        path: /metadata/namespace
        value: slurm-ui-slurm-05150918
      - op: replace
        path: /spec/clusterName
        value: ui-slurm-05150918

  - target:
      kind: NodeSet
    patch: |
      - op: replace
        path: /metadata/name
        value: ui-slurm-05150918-workers
      - op: replace
        path: /metadata/namespace
        value: slurm-ui-slurm-05150918
      - op: replace
        path: /spec/controllerRef/name
        value: ui-slurm-05150918
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-ui-slurm-05150918
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/slurmd/resources/limits/cpu
        value: "3"
      - op: replace
        path: /spec/slurmd/resources/limits/memory
        value: 7Gi

  - target:
      kind: RestApi
    patch: |
      - op: replace
        path: /metadata/name
        value: ui-slurm-05150918
      - op: replace
        path: /metadata/namespace
        value: slurm-ui-slurm-05150918
      - op: replace
        path: /spec/controllerRef/name
        value: ui-slurm-05150918
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-ui-slurm-05150918

  - target:
      kind: Secret
      name: slurm-auth-slurm
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-ui-slurm-05150918
      - op: replace
        path: /data/slurm.key
        value: VQzcArdy4Hc3U80DdFuUZDdV/pPDjOWQ1FzltIOYOn4TLoVxCpLOyDOQWU+5mtJKg58oGZiwNCZrrVTdSaWPHQ==

  - target:
      kind: Secret
      name: slurm-auth-jwt
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-ui-slurm-05150918
      - op: replace
        path: /data/jwt.key
        value: F7n4eEKCZ3AyNktjnqBeZcsRuQVI5cJR3UIHSawhOkE=
