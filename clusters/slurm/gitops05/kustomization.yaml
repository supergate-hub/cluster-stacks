apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/slurm-cluster

patches:
  - target:
      kind: Namespace
    patch: |
      - op: replace
        path: /metadata/name
        value: slurm-gitops05
      - op: replace
        path: /metadata/labels/launcher.supergate.io~1cluster-name
        value: gitops05

  - target:
      kind: Controller
    patch: |
      - op: replace
        path: /metadata/name
        value: gitops05
      - op: replace
        path: /metadata/namespace
        value: slurm-gitops05
      - op: replace
        path: /spec/clusterName
        value: gitops05

  - target:
      kind: NodeSet
    patch: |
      - op: replace
        path: /metadata/name
        value: gitops05-workers
      - op: replace
        path: /metadata/namespace
        value: slurm-gitops05
      - op: replace
        path: /spec/controllerRef/name
        value: gitops05
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-gitops05
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/slurmd/resources/limits/cpu
        value: "4"
      - op: replace
        path: /spec/slurmd/resources/limits/memory
        value: 8Gi

  - target:
      kind: RestApi
    patch: |
      - op: replace
        path: /metadata/name
        value: gitops05
      - op: replace
        path: /metadata/namespace
        value: slurm-gitops05
      - op: replace
        path: /spec/controllerRef/name
        value: gitops05
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-gitops05

  - target:
      kind: Secret
      name: slurm-auth-slurm
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-gitops05
      - op: replace
        path: /data/slurm.key
        value: HjcO73vSzhEztLNFDczHvBJgvLTIobv1S0H2TZvXuNIk3WKbOIEByhw7CJs7iz+uNF83Mwa8vD3jIKDdLLlavw==

  - target:
      kind: Secret
      name: slurm-auth-jwt
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-gitops05
      - op: replace
        path: /data/jwt.key
        value: LeC/LPyYgM75hZJuVpaTbcJWxTnlLZ36469gMLEb+f4=
