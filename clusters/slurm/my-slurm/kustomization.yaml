apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/slurm-cluster
  # login.yaml is rendered alongside kustomization.yaml — it adds the
  # LoginSet CR and its sssd-conf Secret that the upstream base chart
  # doesn't ship. Without it the cluster has no SSH entry point.
  - ./login.yaml

patches:
  - target:
      kind: Namespace
    patch: |
      - op: replace
        path: /metadata/name
        value: slurm-my-slurm
      - op: replace
        path: /metadata/labels/launcher.supergate.io~1cluster-name
        value: my-slurm

  - target:
      kind: Controller
    patch: |
      - op: replace
        path: /metadata/name
        value: my-slurm
      - op: replace
        path: /metadata/namespace
        value: slurm-my-slurm
      - op: replace
        path: /spec/clusterName
        value: my-slurm

  - target:
      kind: NodeSet
    patch: |
      - op: replace
        path: /metadata/name
        value: my-slurm-workers
      - op: replace
        path: /metadata/namespace
        value: slurm-my-slurm
      - op: replace
        path: /spec/controllerRef/name
        value: my-slurm
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-my-slurm
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/slurmd/resources/limits/cpu
        value: "3"
      - op: replace
        path: /spec/slurmd/resources/limits/memory
        value: 7Gi

  - target:
      kind: RestApi
    patch: |
      - op: replace
        path: /metadata/name
        value: my-slurm
      - op: replace
        path: /metadata/namespace
        value: slurm-my-slurm
      - op: replace
        path: /spec/controllerRef/name
        value: my-slurm
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-my-slurm

  - target:
      kind: Secret
      name: slurm-auth-slurm
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-my-slurm
      - op: replace
        path: /data/slurm.key
        value: hByOqKjOP/X43utkCuxaiqIzCscu1dMG4jvRj5X5IRiwrAxUKLnd+WC1JtJ+y5JAbW2CnlmCwL/LoktCR8epQA==

  - target:
      kind: Secret
      name: slurm-auth-jwt
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-my-slurm
      - op: replace
        path: /data/jwt.key
        value: ATAHIJao3386+qy2DPyEqF/bGl4TnbI+oT/PSUztZEU=
