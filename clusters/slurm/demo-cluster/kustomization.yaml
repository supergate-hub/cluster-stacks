apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/slurm-cluster
  # login.yaml is rendered alongside kustomization.yaml — it adds the
  # LoginSet CR and its sssd-conf Secret that the upstream base chart
  # doesn't ship. Without it the cluster has no SSH entry point.
  - ./login.yaml

patches:
  - target:
      kind: Namespace
    patch: |
      - op: replace
        path: /metadata/name
        value: slurm-demo-cluster
      - op: replace
        path: /metadata/labels/launcher.supergate.io~1cluster-name
        value: demo-cluster

  - target:
      kind: Controller
    patch: |
      - op: replace
        path: /metadata/name
        value: demo-cluster
      - op: replace
        path: /metadata/namespace
        value: slurm-demo-cluster
      - op: replace
        path: /spec/clusterName
        value: demo-cluster

  - target:
      kind: NodeSet
    patch: |
      - op: replace
        path: /metadata/name
        value: demo-cluster-workers
      - op: replace
        path: /metadata/namespace
        value: slurm-demo-cluster
      - op: replace
        path: /spec/controllerRef/name
        value: demo-cluster
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-demo-cluster
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/slurmd/resources/limits/cpu
        value: "3"
      - op: replace
        path: /spec/slurmd/resources/limits/memory
        value: 7Gi

  - target:
      kind: RestApi
    patch: |
      - op: replace
        path: /metadata/name
        value: demo-cluster
      - op: replace
        path: /metadata/namespace
        value: slurm-demo-cluster
      - op: replace
        path: /spec/controllerRef/name
        value: demo-cluster
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-demo-cluster

  - target:
      kind: Secret
      name: slurm-auth-slurm
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-demo-cluster
      - op: replace
        path: /data/slurm.key
        value: hR/cBq0l/O7JeRr9YjkwpEcvPMrpk11TJaV2L+Ora9/soD0zcAFavTl6wnAdL0Xm1EfHn14VkznzJu9PMjmHnw==

  - target:
      kind: Secret
      name: slurm-auth-jwt
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-demo-cluster
      - op: replace
        path: /data/jwt.key
        value: h5oa3jcPuT8x2kPSVoBnd8tNAaILO4fBuoz2yO8j6os=
