apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/slurm-cluster
  # login.yaml is rendered alongside kustomization.yaml — it adds the
  # LoginSet CR and its sssd-conf Secret that the upstream base chart
  # doesn't ship. Without it the cluster has no SSH entry point.
  - ./login.yaml
  # extra-nodesets.yaml holds additional NodeSet CRs (beyond the primary
  # patched into the base above). Each entry provisions its own slurmd
  # pod group with optional Slurm partition metadata.
  - ./extra-nodesets.yaml

patches:
  - target:
      kind: Namespace
    patch: |
      - op: replace
        path: /metadata/name
        value: slurm-emerald-storm-cluster
      - op: replace
        path: /metadata/labels/launcher.supergate.io~1cluster-name
        value: emerald-storm-cluster

  - target:
      kind: Controller
    patch: |
      - op: replace
        path: /metadata/name
        value: emerald-storm-cluster
      - op: replace
        path: /metadata/namespace
        value: slurm-emerald-storm-cluster
      - op: replace
        path: /spec/clusterName
        value: emerald-storm-cluster

  - target:
      kind: NodeSet
    patch: |
      - op: replace
        path: /metadata/name
        value: emerald-storm-cluster-workers
      - op: replace
        path: /metadata/namespace
        value: slurm-emerald-storm-cluster
      - op: replace
        path: /spec/controllerRef/name
        value: emerald-storm-cluster
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-emerald-storm-cluster
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/slurmd/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/slurmd/resources/limits/memory
        value: 2Gi
      # Primary-group Slurm partition. Uses op=add (not replace) because
      # the base NodeSet in the upstream chart doesn't declare spec.partition.
      - op: add
        path: /spec/partition
        value:
          enabled: true
          config: "Name=default Default=YES MaxTime=24:00:00"

  - target:
      kind: RestApi
    patch: |
      - op: replace
        path: /metadata/name
        value: emerald-storm-cluster
      - op: replace
        path: /metadata/namespace
        value: slurm-emerald-storm-cluster
      - op: replace
        path: /spec/controllerRef/name
        value: emerald-storm-cluster
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-emerald-storm-cluster

  - target:
      kind: Secret
      name: slurm-auth-slurm
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-emerald-storm-cluster
      - op: replace
        path: /data/slurm.key
        value: 1F4zHQ8FLA6W9ja2DsAEgaAivfbcuDyJe0WGOKaWHZTp1NfHW+MetLeVXDiY26fKMr7N+yQ4LsoU3ZphfbbkaQ==

  - target:
      kind: Secret
      name: slurm-auth-jwt
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-emerald-storm-cluster
      - op: replace
        path: /data/jwt.key
        value: cO7dYZGgJDISdjSewJ10q2CCIHarU0nztP/YUGEQA1k=
