apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/slurm-cluster

patches:
  - target:
      kind: Namespace
    patch: |
      - op: replace
        path: /metadata/name
        value: slurm-gitops01
      - op: replace
        path: /metadata/labels/launcher.supergate.io~1cluster-name
        value: gitops01

  - target:
      kind: Controller
    patch: |
      - op: replace
        path: /metadata/name
        value: gitops01
      - op: replace
        path: /metadata/namespace
        value: slurm-gitops01
      - op: replace
        path: /spec/clusterName
        value: gitops01

  - target:
      kind: NodeSet
    patch: |
      - op: replace
        path: /metadata/name
        value: gitops01-workers
      - op: replace
        path: /metadata/namespace
        value: slurm-gitops01
      - op: replace
        path: /spec/controllerRef/name
        value: gitops01
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-gitops01
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/slurmd/resources/limits/cpu
        value: "4"
      - op: replace
        path: /spec/slurmd/resources/limits/memory
        value: 8Gi

  - target:
      kind: RestApi
    patch: |
      - op: replace
        path: /metadata/name
        value: gitops01
      - op: replace
        path: /metadata/namespace
        value: slurm-gitops01
      - op: replace
        path: /spec/controllerRef/name
        value: gitops01
      - op: replace
        path: /spec/controllerRef/namespace
        value: slurm-gitops01

  - target:
      kind: Secret
      name: slurm-auth-slurm
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-gitops01
      - op: replace
        path: /data/slurm.key
        value: HuEteq3wRJb/Zf+PKRJK/3QNaKlQ3brxbEXABw205nP/jlpyE2Lx/6OqQtTfPgQFdd3++noM++hQGkxgnXyu/g==

  - target:
      kind: Secret
      name: slurm-auth-jwt
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-gitops01
      - op: replace
        path: /data/jwt.key
        value: JBnOmuHB4yc3349zZAjyLonHs4reA2hhCUG+ameLW9I=
