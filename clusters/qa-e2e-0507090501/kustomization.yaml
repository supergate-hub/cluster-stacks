apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/tenant-infra

patches:
  - target:
      kind: Namespace
      name: NAMESPACE
    patch: |
      - op: replace
        path: /metadata/name
        value: slurm-qa-e2e-0507090501
      - op: replace
        path: /metadata/labels/launcher.supergate.io~1cluster-name
        value: qa-e2e-0507090501

  - target:
      kind: KamajiControlPlane
      name: CLUSTER_NAME-control-plane
    patch: |
      - op: replace
        path: /metadata/name
        value: qa-e2e-0507090501-control-plane
      - op: replace
        path: /metadata/namespace
        value: slurm-qa-e2e-0507090501
      - op: replace
        path: /spec/version
        value: "v1.30.0"
      - op: replace
        path: /spec/network/certSANs/0
        value: qa-e2e-0507090501.k8s.launcher.internal

  - target:
      kind: Cluster
      name: CLUSTER_NAME
    patch: |
      - op: replace
        path: /metadata/name
        value: qa-e2e-0507090501
      - op: replace
        path: /metadata/namespace
        value: slurm-qa-e2e-0507090501
      - op: replace
        path: /spec/controlPlaneRef/name
        value: qa-e2e-0507090501-control-plane
      - op: replace
        path: /spec/infrastructureRef/name
        value: qa-e2e-0507090501

  - target:
      kind: OpenStackCluster
      name: CLUSTER_NAME
    patch: |
      - op: replace
        path: /metadata/name
        value: qa-e2e-0507090501
      - op: replace
        path: /metadata/namespace
        value: slurm-qa-e2e-0507090501
      - op: replace
        path: /spec/identityRef/name
        value: cloud-config
      - op: replace
        path: /spec/identityRef/cloudName
        value: capi-test
      - op: replace
        path: /spec/externalNetwork/id
        value: fea71d83-27da-4636-9a8b-842f93bcaccf
      - op: replace
        path: /spec/managedSecurityGroups
        value:
          allowAllInClusterTraffic: false
          workerNodesSecurityGroupRules:
            - name: cilium-vxlan-worker-self
              description: Allow Cilium VXLAN overlay traffic between tenant worker nodes
              direction: ingress
              etherType: IPv4
              protocol: udp
              portRangeMin: 8472
              portRangeMax: 8472
              remoteManagedGroups:
                - worker

  - target:
      kind: OpenStackMachineTemplate
      name: CLUSTER_NAME-worker-mt
    patch: |
      - op: replace
        path: /metadata/name
        value: qa-e2e-0507090501-worker-mt
      - op: replace
        path: /metadata/namespace
        value: slurm-qa-e2e-0507090501
      - op: replace
        path: /spec/template/spec/flavor
        value: a4v2
      - op: replace
        path: /spec/template/spec/image/filter/name
        value: ubuntu-2404-kube-v1.30.0
      - op: replace
        path: /spec/template/spec/sshKeyName
        value: capi-test
      - op: replace
        path: /spec/template/spec/identityRef/name
        value: cloud-config
      - op: replace
        path: /spec/template/spec/identityRef/cloudName
        value: capi-test

  - target:
      kind: KubeadmConfigTemplate
      name: CLUSTER_NAME-worker-config
    patch: |
      - op: replace
        path: /metadata/name
        value: qa-e2e-0507090501-worker-config
      - op: replace
        path: /metadata/namespace
        value: slurm-qa-e2e-0507090501

  - target:
      kind: MachineDeployment
      name: CLUSTER_NAME-md-0
    patch: |
      - op: replace
        path: /metadata/name
        value: qa-e2e-0507090501-md-0
      - op: replace
        path: /metadata/namespace
        value: slurm-qa-e2e-0507090501
      - op: replace
        path: /spec/clusterName
        value: qa-e2e-0507090501
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/clusterName
        value: qa-e2e-0507090501
      - op: replace
        path: /spec/template/spec/version
        value: v1.30.0
      - op: replace
        path: /spec/template/spec/bootstrap/configRef/name
        value: qa-e2e-0507090501-worker-config
      - op: replace
        path: /spec/template/spec/infrastructureRef/name
        value: qa-e2e-0507090501-worker-mt

  - target:
      kind: ClusterResourceSet
      name: cilium-cni
    patch: |
      - op: replace
        path: /metadata/namespace
        value: slurm-qa-e2e-0507090501
