apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-observability-agent
  namespace: slurm-lb-e2e-0605b
data:
  observability.yaml: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: launcher-observability
      labels:
        app.kubernetes.io/managed-by: launcher
        launcher.supergate.io/cluster-name: slurm-lb-e2e-0605b
    ---
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: prometheus-agent
      namespace: launcher-observability
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: launcher-prometheus-agent
    rules:
      - apiGroups: [""]
        resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
        verbs: ["get", "list", "watch"]
      - nonResourceURLs: ["/metrics"]
        verbs: ["get"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: launcher-prometheus-agent
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: launcher-prometheus-agent
    subjects:
      - kind: ServiceAccount
        name: prometheus-agent
        namespace: launcher-observability
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: prometheus-agent-config
      namespace: launcher-observability
    data:
      prometheus.yml: |
        global:
          scrape_interval: 15s
          external_labels:
            cluster: slurm-lb-e2e-0605b
            launcher_cluster: slurm-lb-e2e-0605b
        remote_write:
          - url: http://192.168.122.208:8428/api/v1/write
        scrape_configs:
          - job_name: kubelet-cadvisor
            scheme: https
            kubernetes_sd_configs:
              - role: node
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            tls_config:
              insecure_skip_verify: true
            relabel_configs:
              - target_label: __address__
                replacement: kubernetes.default.svc:443
              - source_labels: [__meta_kubernetes_node_name]
                regex: (.+)
                target_label: __metrics_path__
                replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
              - source_labels: [__meta_kubernetes_node_name]
                target_label: node
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: prometheus-agent
      namespace: launcher-observability
      labels:
        app.kubernetes.io/name: prometheus-agent
        app.kubernetes.io/managed-by: launcher
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: prometheus-agent
      template:
        metadata:
          annotations:
            launcher.supergate.io/config-hash: "573a73a38795fae9"
          labels:
            app.kubernetes.io/name: prometheus-agent
            app.kubernetes.io/managed-by: launcher
            launcher.supergate.io/cluster-name: slurm-lb-e2e-0605b
        spec:
          serviceAccountName: prometheus-agent
          containers:
            - name: prometheus
              image: quay.io/prometheus/prometheus:v3.2.1
              args:
                - --config.file=/etc/prometheus/prometheus.yml
                - --storage.tsdb.path=/prometheus
                - --storage.tsdb.retention.time=2h
                - --web.listen-address=:9090
              ports:
                - name: http
                  containerPort: 9090
              volumeMounts:
                - name: config
                  mountPath: /etc/prometheus
                - name: data
                  mountPath: /prometheus
          volumes:
            - name: config
              configMap:
                name: prometheus-agent-config
            - name: data
              emptyDir: {}
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: tenant-observability
  namespace: slurm-lb-e2e-0605b
spec:
  strategy: Reconcile
  clusterSelector:
    matchLabels:
      launcher.supergate.io/observability: enabled
  resources:
    - name: tenant-observability-agent
      kind: ConfigMap
