schemaVersion: 1
engine: sveltos
sveltos:
  apiVersion: config.projectsveltos.io/v1beta1
  syncMode: Continuous
  driftDetection: false
  healthChecks: false
helm:
  fixedValues:
    dex.enabled: false
    notifications.enabled: false
    server.service.type: ClusterIP
  valueMappings: {}
lifecycle:
  defaultDataPolicy: Delete
  supportedDataPolicies:
    - Delete
  retainedResources: []
access:
  type: service-proxy
  serviceNameTemplate: "${releaseName}-server"
  servicePort: 80
  credential:
    source: target-secret
    secretNameTemplate: "${releaseName}-initial-admin-secret"
    secretKey: password
